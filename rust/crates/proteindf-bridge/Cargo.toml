[package]
name = "proteindf-bridge"
version = "0.1.0"
edition = "2021"
authors = ["The ProteinDF development team"]
license = "GPL-3.0-or-later"
description = "Core library for ProteinDF bridge in Rust"

[dependencies]
thiserror = "2.0"
indexmap = "2.7"
regex = "1.11"
rmpv = "1.3"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
zstd = "0.13"
log = "0.4"

