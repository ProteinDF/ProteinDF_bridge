[package]
name = "proteindf-bridge"
version = "0.1.0"
edition = "2021"
authors = ["The ProteinDF development team"]
license = "GPL-3.0-or-later"
description = "Core library for ProteinDF bridge in Rust"

[dependencies]
thiserror = "2.0"
indexmap = "2.7"
regex = "1.11"
rmpv = "1.3"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = { workspace = true }

[features]
default = ["zstd"]
# Bindings to the C libzstd library (fast, requires a C toolchain at build time).
zstd = ["dep:zstd"]
# Pure-Rust zstd implementation (no C toolchain required, slower). Mutually
# exclusive with the `zstd` feature; select it with `--no-default-features
# --features ruzstd`.
ruzstd = ["dep:ruzstd"]

