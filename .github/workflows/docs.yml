name: docs

on:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "proteindf_bridge/**"
      - "setup.cfg"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[docs]
      - name: Build English HTML
        run: sphinx-build -b html -D language=en docs _site/en
      - name: Build Japanese HTML
        run: sphinx-build -b html -D language=ja docs _site/ja
      - name: Add language picker landing page
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./en/">
              <title>ProteinDF_bridge documentation</title>
            </head>
            <body>
              <p><a href="./en/">English</a></p>
              <p><a href="./ja/">日本語</a></p>
            </body>
          </html>
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: html-site
          path: _site

  pdf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[docs]
      - name: Install TeX (English + Japanese)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-japanese texlive-luatex
      - name: Build PDFs
        run: |
          make -C docs latexpdf
          make -C docs latexpdf-ja
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-site
          path: |
            docs/_build/latex/en/*.pdf
            docs/_build/latex/ja/*.pdf

  deploy:
    needs: [html, pdf]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: html-site
          path: _site
      - uses: actions/download-artifact@v4
        if: needs.pdf.result == 'success'
        with:
          name: pdf-site
          path: _site/pdf
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
