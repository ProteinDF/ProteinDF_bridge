name: Release

on:
  push:
    branches:
      - feature/packaging-pr51
    tags:
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Wheel (Linux ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            manylinux: 2014
          - target: aarch64-unknown-linux-gnu
            manylinux: 2014
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Test wheel on x86_64
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          pip install dist/*.whl
          python -P -m unittest discover -s tests
          pdb2brd.py --help
          brd2pdb.py --help
          neutralize.py --help
      - name: Set up QEMU for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3
      - name: Test wheel on aarch64 (emulated)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/io -w /io python:3.12-slim bash -c "
            pip install dist/*aarch64*.whl &&
            python -P -m unittest discover -s tests &&
            pdb2brd.py --help &&
            brd2pdb.py --help &&
            neutralize.py --help
          "
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  macos:
    name: Wheel (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist
      - name: Test wheel
        run: |
          pip install dist/*.whl
          python -P -m unittest discover -s tests
          pdb2brd.py --help
          brd2pdb.py --help
          neutralize.py --help
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist/*.whl

  sdist:
    name: Source distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Test sdist
        run: |
          pip install dist/*.tar.gz
          python -P -m unittest discover -s tests
          pdb2brd.py --help
          brd2pdb.py --help
          neutralize.py --help
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, macos, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch annotated tags
        run: git fetch --tags --force
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true
      - name: Inspect artifacts
        run: ls -la dist/
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -n "$TAG_MSG" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$TAG_MSG"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-from-tag
          fi
